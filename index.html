<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chivas Salvo — Artist</title>
    <meta name="description" content="Chivas Salvo — Official Artist Page">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080808;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            text-align: center;
            padding: 55px 30px;
            background: #101010;
            border: 1px solid #252525;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.55);
        }

        .verified {
            display: inline-block;
            color: #999;
            border: 1px solid #303030;
            border-radius: 50px;
            padding: 8px 15px;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        h1 {
            font-size: clamp(48px, 10vw, 82px);
            letter-spacing: -4px;
            line-height: 1;
            margin-bottom: 15px;
        }

        .artist {
            color: #999;
            font-size: 18px;
            margin-bottom: 35px;
        }

        .info {
            background: #171717;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .info-title {
            color: #777;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .info-text {
            color: #eee;
            font-size: 16px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 25px;
        }

        .links a {
            display: block;
            width: 100%;
            padding: 16px 20px;
            border: 1px solid #333;
            border-radius: 13px;
            color: white;
            text-decoration: none;
            background: #141414;
            transition: all 0.2s ease;
        }

        .links a:hover {
            background: #fff;
            color: #000;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 35px;
            color: #555;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="verified">
            Official Artist Page
        </div>

        <h1>Chivas Salvo</h1>

        <p class="artist">
            Artist / Musician
        </p>

        <div class="info">
            <div class="info-title">Name</div>
            <div class="info-text">
                Chivas Salvo
            </div>
        </div>

        <div class="info">
            <div class="info-title">Contact</div>
            <div class="info-text">
                seniorchivas0@gmail.com
            </div>
        </div>

        <div class="info">
            <div class="info-title">Distributor</div>
            <div class="info-text">
                Ümijam
            </div>
        </div>

        <div class="links">

            <!-- Spotify -->
            <a href="https://open.spotify.com/intl-tr/artist/6UCzBrKLeqRS8aQ3EBnEX0?si=xuVf_tOfQ6uayr6O2Zs_BA"
               target="_blank"
               rel="noopener noreferrer">
                Spotify Artist Profile
            </a>

            <!-- TikTok -->
            <a href="https://www.tiktok.com/@chivassaint"
               target="_blank"
               rel="noopener noreferrer">
                TikTok — @chivassaint
            </a>

            <!-- Ümijam Bio -->
            <a href="https://musicdistribution.umijam.com/biolink/NDE4MTIx"
               target="_blank"
               rel="noopener noreferrer">
                Ümijam Artist Bio
            </a>

            <!-- Ümijam -->
            <a href="https://umijam.com/tr/"
               target="_blank"
               rel="noopener noreferrer">
                Ümijam — Distributor
            </a>

        </div>

        <footer>
            © 2026 Chivas Salvo
        </footer>

    </main>

</body>
</html>
